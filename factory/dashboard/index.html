<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fábrica · tablero</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1e2230; --line: #2a2f3d; --text: #e6e8ee; --muted: #8b93a7;
    --accent: #8b7cff; --pass: #3ec28f; --changes: #f0a33c; --bad: #ff5d6c; --pending: #4b5268; --human: #ffcc4d;
    --mono: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f5f8; --panel: #ffffff; --panel-2: #eef0f5; --line: #d9dce6; --text: #171a21; --muted: #5d6579; --pending: #c9cdd9; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .04em; text-transform: uppercase; }
  header h1 span { color: var(--accent); }
  .status { font-family: var(--mono); font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pass); box-shadow: 0 0 0 3px color-mix(in srgb, var(--pass) 25%, transparent); }
  .dot.err { background: var(--bad); box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 25%, transparent); }
  .badge { font-family: var(--mono); font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .badge.warn { color: var(--human); border-color: var(--human); }
  .legend { margin-left: auto; display: flex; gap: 10px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }

  main { padding: 16px 20px 40px; }
  .board { display: grid; grid-template-columns: repeat(6, minmax(190px, 1fr)); gap: 12px; align-items: start; }
  @media (max-width: 1200px) { .board { grid-template-columns: repeat(3, minmax(190px, 1fr)); } }
  @media (max-width: 700px) { .board { grid-template-columns: 1fr; } }
  .col { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-height: 120px; padding: 10px; }
  .col h2 { margin: 0 0 10px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; font-family: var(--mono); }
  .col h2 b { color: var(--text); }
  .col.human h2 { color: var(--human); }
  .col.merged h2 { color: var(--pass); }
  .empty { color: var(--muted); font-size: 12px; text-align: center; padding: 28px 6px; font-style: italic; }

  .card { width: 100%; text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 8px; cursor: pointer; color: inherit; font: inherit; transition: border-color .15s, transform .15s; }
  .card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .card.open { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); }
  .card.live { border-left: 3px solid var(--accent); }
  .card.human { border-left: 3px solid var(--human); }
  .card.merged { border-left: 3px solid var(--pass); }
  .card .id { font-family: var(--mono); font-size: 12px; color: var(--accent); }
  .card .feat { margin: 4px 0 8px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .rounds { display: flex; flex-direction: column; gap: 4px; }
  .round { display: flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .round .n { width: 22px; }
  .chip { height: 16px; padding: 0 6px; border-radius: 4px; font-size: 10px; line-height: 16px; color: #0f1115; font-weight: 600; background: var(--pending); text-transform: uppercase; }
  .chip.PASS { background: var(--pass); } .chip.CHANGES { background: var(--changes); } .chip.invalid, .chip.missing { background: var(--bad); color: #fff; }
  .chip.pending { color: var(--text); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .meta { margin-top: 8px; font-family: var(--mono); font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
  .meta .d { color: var(--human); }
  .meta .d.APPROVE { color: var(--pass); }
  .meta .d.BLOCKED { color: var(--bad); }

  /* Paneles bajo el tablero: el backlog (la cola) y las métricas de los jobs */
  .panels { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 12px; margin-top: 12px; align-items: start; }
  @media (max-width: 1000px) { .panels { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px 14px; }
  .panel h2 { margin: 0 0 10px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 10px; font-family: var(--mono); }
  .panel h2 b { color: var(--text); font-weight: 600; text-transform: none; letter-spacing: 0; }
  .panel h3 { margin: 14px 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-family: var(--mono); font-weight: 600; }
  .backlog { margin: 0; padding-left: 28px; display: flex; flex-direction: column; gap: 6px; }
  .backlog li { padding-left: 4px; }
  .backlog li::marker { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .backlog li.done { color: var(--muted); display: flex; gap: 8px; align-items: baseline; }
  .backlog li.done .t { text-decoration: line-through; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .backlog .next { font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #0f1115; background: var(--accent); border-radius: 4px; padding: 1px 6px; margin-right: 6px; vertical-align: 1px; }
  .backlog .job { font: 11px var(--mono); color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; white-space: nowrap; }
  .backlog .job[disabled] { color: var(--muted); cursor: default; }
  .backlog code, .panel .empty code { font-family: var(--mono); font-size: 12px; background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 14px; margin: 0 0 12px; }
  .stats div { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .stats b { display: block; font-size: 15px; color: var(--text); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; }
  .chips button { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 2px 9px; font: 11px var(--mono); cursor: pointer; }
  .chips button[aria-checked="true"] { color: var(--text); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, transparent); }
  .bars { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; font-family: var(--mono); font-size: 11px; }
  .bars .l { color: var(--muted); white-space: nowrap; } .bars .v { color: var(--text); text-align: right; white-space: nowrap; }
  .bars .b { height: 8px; border-radius: 999px; background: var(--panel-2); overflow: hidden; }
  .bars .b i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }

  /* Drawer */
  .drawer { position: fixed; top: 0; right: 0; height: 100vh; width: min(960px, 92vw); background: var(--panel); border-left: 1px solid var(--line); transform: translateX(105%); transition: transform .2s; z-index: 10; display: grid; grid-template-rows: auto auto 1fr; }
  .drawer.open { transform: none; }
  .drawer header { position: static; display: block; }
  .drawer header .top { display: flex; align-items: center; gap: 10px; }
  .drawer header .top .id { font-family: var(--mono); color: var(--accent); }
  .drawer header .top .stage { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .drawer header .close { margin-left: auto; background: none; border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
  .drawer header .feat { margin-top: 6px; color: var(--muted); }
  .tabs { display: flex; gap: 2px; padding: 8px 12px 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tab { background: none; border: 1px solid transparent; border-bottom: none; color: var(--muted); font: 12px var(--mono); padding: 6px 10px; border-radius: 6px 6px 0 0; cursor: pointer; white-space: nowrap; }
  .tab.on { color: var(--text); background: var(--panel-2); border-color: var(--line); }
  .tab.sep { margin-left: auto; }
  .content { overflow: auto; padding: 16px 20px 40px; }
  .verdict { display: inline-block; font-family: var(--mono); font-weight: 700; padding: 3px 10px; border-radius: 6px; margin-bottom: 12px; color: #0f1115; }
  .verdict.PASS, .verdict.APPROVE, .verdict.READY { background: var(--pass); } .verdict.CHANGES, .verdict.ESCALATE { background: var(--changes); } .verdict.BLOCKED { background: var(--bad); color: #fff; }
  .md h1 { font-size: 20px; margin: 0 0 12px; } .md h2 { font-size: 14px; margin: 18px 0 6px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); } .md h3 { font-size: 14px; margin: 14px 0 4px; }
  .md p { margin: 6px 0; } .md ul, .md ol { padding-left: 22px; margin: 6px 0; } .md li { margin: 3px 0; }
  .md code { font-family: var(--mono); font-size: 12px; background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
  .md pre { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow: auto; font-family: var(--mono); font-size: 12px; }
  .md pre code { background: none; padding: 0; }
  .md blockquote { margin: 8px 0; padding: 4px 12px; border-left: 3px solid var(--accent); color: var(--muted); }
  .md table { border-collapse: collapse; margin: 8px 0; font-size: 13px; } .md th, .md td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
  .md a { color: var(--accent); }
  .md input[type=checkbox] { margin-right: 6px; }
  pre.diff { font-family: var(--mono); font-size: 12px; line-height: 1.5; margin: 0; white-space: pre; }
  .diff .add { color: var(--pass); } .diff .del { color: var(--bad); } .diff .hunk { color: #5fb4ff; } .diff .file { color: var(--accent); font-weight: 700; display: block; margin-top: 12px; } .diff .stat { color: var(--muted); }
  .source { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-bottom: 10px; }
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 9; display: none; }
  .backdrop.open { display: block; }
</style>
</head>
<body>
<header>
  <h1><span>■</span> Fábrica</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="status">conectando…</span></div>
  <span class="badge" id="source"></span>
  <span class="badge" id="reviewers"></span>
  <div class="legend">
    <span><i style="background:var(--pass)"></i>PASS</span>
    <span><i style="background:var(--changes)"></i>CHANGES</span>
    <span><i style="background:var(--pending)"></i>pendiente</span>
    <span><i style="background:var(--bad)"></i>inválido</span>
  </div>
  <button class="close" id="pause" title="El cron no empieza vueltas mientras exista factory/PAUSED"></button>
</header>
<main>
  <div class="board" id="board"></div>
  <div class="panels">
    <section class="panel" aria-label="Backlog"><h2>Backlog <b id="backlog-n"></b></h2><ol class="backlog" id="backlog"></ol></section>
    <section class="panel" aria-label="Métricas"><h2>Métricas <b id="metrics-n"></b></h2><div id="metrics"></div></section>
  </div>
</main>

<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer" aria-label="Detalle del job">
  <header>
    <div class="top"><span class="id" id="d-id"></span><span class="stage" id="d-stage"></span><button class="close" id="d-approve" hidden>Aprobar y fusionar</button><button class="close" id="d-close">Cerrar ⎋</button></div>
    <div class="feat" id="d-feat"></div>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="content" id="content"></div>
</aside>

<script>
const POLL_MS = 2000;
const STAGES = [
  ['spec', 'Spec'], ['build', 'Build'], ['review', 'Review'], ['approve', 'Approve'], ['needs-human', 'Needs human'], ['merged', 'Merged'],
];
const LIVE = new Set(['spec', 'build', 'review', 'approve']);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

let state = null, lastJson = '', open = { id: null, tab: null };

async function getJson(url) { const r = await fetch(url, { cache: 'no-store' }); if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`); return r.json(); }
async function getText(url) { const r = await fetch(url, { cache: 'no-store' }); if (!r.ok) throw new Error(`${url}: HTTP ${r.status}`); return r.text(); }

function ago(iso) {
  if (!iso) return '';
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  if (s < 90) return 'hace ' + Math.round(s) + ' s';
  if (s < 5400) return 'hace ' + Math.round(s / 60) + ' min';
  if (s < 172800) return 'hace ' + Math.round(s / 3600) + ' h';
  return 'hace ' + Math.round(s / 86400) + ' d';
}
function duration(a, b) {
  if (!a || !b) return '';
  const m = Math.round((new Date(b) - new Date(a)) / 60000);
  return m < 60 ? m + ' min' : (m / 60).toFixed(1) + ' h';
}

function card(job) {
  const rounds = Object.keys(job.rounds || {}).sort((x, y) => x - y).map((n) =>
    `<div class="round"><span class="n">R${n}</span>${job.reviewers.map((l) => `<span class="chip ${esc(job.rounds[n][l])}" title="${esc(l)}: ${esc(job.rounds[n][l])}">${esc(l.slice(0, 4))}</span>`).join('')}</div>`
  ).join('');
  const d = job.decision || (job.build_status === 'BLOCKED' ? 'BLOCKED' : '');
  const cls = ['card', LIVE.has(job.stage) ? 'live' : '', job.stage === 'needs-human' ? 'human' : '', job.stage === 'merged' ? 'merged' : '', open.id === job.id ? 'open' : ''].join(' ');
  return `<button class="${cls}" data-id="${esc(job.id)}">
    <div class="id">${esc(job.id)}</div>
    <div class="feat">${esc(job.feature || job.error || '')}</div>
    <div class="rounds">${rounds}</div>
    <div class="meta"><span>${esc(ago(job.updated))}${job.stage === 'merged' ? ' · ' + esc(duration(job.created, job.updated)) : ''}</span><span class="d ${esc(d)}">${esc(d)}</span></div>
  </button>`;
}

function renderBoard() {
  const by = Object.fromEntries(STAGES.map(([k]) => [k, []]));
  const problems = [];
  for (const job of state.jobs) (by[job.stage] || (problems.push(job), [])).push(job);
  $('board').innerHTML = STAGES.map(([k, label]) =>
    `<section class="col ${k}"><h2>${label} <b>${by[k].length}</b></h2>${by[k].length ? by[k].map(card).join('') : '<div class="empty">—</div>'}</section>`
  ).join('');
  if (!state.jobs.length) $('board').innerHTML += `<div class="empty" style="grid-column:1/-1;padding:40px">No hay jobs todavía. Lanza <code>/factory &lt;feature&gt;</code> en Claude Code dentro de este repo, o arranca el dashboard con <code>--examples</code>.</div>`;
  for (const b of document.querySelectorAll('.card')) b.addEventListener('click', () => openJob(b.dataset.id));
  $('source').textContent = (state.examples ? 'EJEMPLOS · ' : '') + state.jobsDir;
  $('source').className = 'badge' + (state.examples ? ' warn' : '');
  $('reviewers').textContent = 'reviewers: ' + ((state.config.reviewers || []).join(', ') || '—') + ' · max_resumes ' + (state.config.max_resumes ?? '?');
  if (problems.length) $('status').textContent += ` · ${problems.length} job(s) con etapa desconocida`;
}

// ---- Backlog (factory/backlog.md): la cola en orden, la primera pendiente es la siguiente ----
function renderBacklog() {
  const items = state.backlog, ol = $('backlog');
  if (!items) { $('backlog-n').textContent = ''; ol.innerHTML = '<li class="empty" style="list-style:none">No hay <code>factory/backlog.md</code>.</li>'; return; }
  const pending = items.filter((b) => !b.done).length, done = items.length - pending;
  $('backlog-n').textContent = `${pending} pendiente${pending === 1 ? '' : 's'} · ${done} hecho${done === 1 ? '' : 's'}`;
  let next = true;
  ol.innerHTML = items.map((b) => {
    const tag = !b.done && next ? (next = false, '<span class="next">Siguiente</span>') : '';
    // reclamada: el job delante y el texto en una línea (tachado); pendiente: el texto entero
    const link = b.job === 'claimed' ? '<span class="job" disabled>en marcha →</span>'
      : b.job ? `<button class="job" data-id="${esc(b.job)}" ${job(b.job) ? '' : 'disabled'} title="${job(b.job) ? 'Abrir el job' : 'No hay job con ese id'}">${esc(b.job)} →</button>` : '';
    return `<li class="${b.done ? 'done' : ''}" title="${b.done ? esc(b.text) : ''}">${tag}${link}<span class="t">${inline(b.text)}</span></li>`;
  }).join('') || '<li class="empty" style="list-style:none">Backlog vacío.</li>';
  for (const b of ol.querySelectorAll('button.job')) b.addEventListener('click', () => openJob(b.dataset.id));
}

// ---- Métricas (factory/metrics.json, lo escribe factory/metrics.py tras cada vuelta) ----
const num = (n, d = 0) => new Intl.NumberFormat('es-ES', { maximumFractionDigits: d, minimumFractionDigits: d }).format(Number(n) || 0);
const mtok = (n) => num(n / 1e6, 1) + ' M';
const MAGNITUDES = [
  ['minutes', 'Minutos', (v) => num(v) + ' min'], ['turns', 'Turnos', (v) => num(v) + ' turnos'], ['output_tokens', 'Tokens de salida', (v) => num(v) + ' tok'],
  ['input_tokens', 'Tokens de entrada', (v) => mtok(v) + ' tok'], ['ctx_avg', 'ctx medio', (v) => num(v) + ' tok'], ['ctx_max', 'ctx máx', (v) => num(v) + ' tok'], ['round', 'Rondas', (v) => num(v) + ' rondas'],
];
let magnitude = 'minutes';

function renderMetrics() {
  const m = state.metrics, box = $('metrics');
  const jobs = m && Array.isArray(m.jobs) ? m.jobs : null;
  if (!jobs) { $('metrics-n').textContent = ''; box.innerHTML = '<div class="empty">Sin métricas todavía: las escribe <code>python -I factory/metrics.py</code> tras cada vuelta del cron.</div>'; return; }
  $('metrics-n').textContent = `${jobs.length} jobs · ${ago(m.updated)}`;
  const val = (j, k) => Number(j[k]) || 0;
  const sum = (k) => jobs.reduce((s, j) => s + val(j, k), 0);
  const mean = (k) => (jobs.length ? sum(k) / jobs.length : 0);
  const models = {};
  for (const j of jobs) for (const [k, v] of Object.entries(j.models || {})) models[k] = (models[k] || 0) + (Number(v) || 0);
  const allTurns = Object.values(models).reduce((s, v) => s + v, 0);
  const [, label, fmt] = MAGNITUDES.find((x) => x[0] === magnitude) || MAGNITUDES[0];
  const max = Math.max(1, ...jobs.map((j) => val(j, magnitude)));
  const bar = (l, frac, v, title = l) => `<span class="l" title="${esc(title)}">${esc(l)}</span><span class="b"><i style="width:${(100 * frac).toFixed(1)}%"></i></span><span class="v">${esc(v)}</span>`;
  box.innerHTML = `
    <div class="stats">
      <div>Minutos (total · media)<b>${num(sum('minutes'))} · ${num(mean('minutes'))}</b></div>
      <div>Turnos (total · media)<b>${num(sum('turns'))} · ${num(mean('turns'))}</b></div>
      <div>Tokens de salida (total · media)<b>${num(sum('output_tokens'))} · ${num(mean('output_tokens'))}</b></div>
      <div>Tokens de entrada (total · media)<b>${mtok(sum('input_tokens'))} · ${mtok(mean('input_tokens'))}</b></div>
      <div>ctx máx<b>${num(Math.max(0, ...jobs.map((j) => val(j, 'ctx_max'))))}</b></div>
      <div>Rondas medias<b>${num(mean('round'), 1)}</b></div>
    </div>
    <div class="chips" role="radiogroup" aria-label="Magnitud del gráfico">${MAGNITUDES.map(([k, l]) => `<button role="radio" aria-checked="${k === magnitude}" data-k="${k}">${l}</button>`).join('')}</div>
    <div class="bars" aria-label="${esc(label)} por job">${jobs.map((j) => bar(j.id.slice(0, 3), val(j, magnitude) / max, fmt(val(j, magnitude)), j.id)).join('')}</div>
    <h3>Modelos</h3>
    <div class="bars" aria-label="Reparto de modelos">${Object.entries(models).sort((a, b) => b[1] - a[1]).map(([k, v]) => bar(k, allTurns ? v / allTurns : 0, `${num(v)} turnos · ${num(allTurns ? (100 * v) / allTurns : 0)} %`)).join('') || '<span class="l">—</span>'}</div>`;
  for (const b of box.querySelectorAll('.chips button')) b.addEventListener('click', () => { magnitude = b.dataset.k; renderMetrics(); });
}

async function poll() {
  try {
    const s = await getJson('/api/state');
    $('pause').textContent = s.paused ? '⏸ Fábrica en pausa · reanudar' : '▶ Fábrica activa · pausar';
    const json = JSON.stringify(s.jobs) + JSON.stringify(s.config) + JSON.stringify(s.backlog) + JSON.stringify(s.metrics);
    state = s;
    $('dot').className = 'dot';
    $('status').textContent = 'actualizado ' + new Date().toLocaleTimeString();
    if (json !== lastJson) { lastJson = json; renderBoard(); renderBacklog(); renderMetrics(); if (open.id) refreshDrawer(); }
  } catch (e) {
    $('dot').className = 'dot err';
    $('status').textContent = e.message;
  }
}

// ---- Drawer ----
function job(id) { return state && state.jobs.find((j) => j.id === id); }

function openJob(id) {
  const j = job(id); if (!j) return;
  open = { id, tab: open.id === id && open.tab ? open.tab : (j.files.includes('decision.md') ? 'decision.md' : j.files[0] || 'diff') };
  $('drawer').classList.add('open'); $('backdrop').classList.add('open');
  renderBoard(); refreshDrawer();
}
function closeDrawer() { open = { id: null, tab: null }; $('drawer').classList.remove('open'); $('backdrop').classList.remove('open'); renderBoard(); }
$('d-close').addEventListener('click', closeDrawer);
$('d-approve').addEventListener('click', async () => {
  const r = await fetch(`/api/approve?job=${encodeURIComponent(open.id)}`, { method: 'POST' });
  $('d-approve').textContent = r.ok ? 'Aprobado: lo fusiona la siguiente vuelta del cron' : `No se pudo: ${(await r.json()).error}`;
});
$('pause').addEventListener('click', async () => { await fetch('/api/pause', { method: 'POST' }); });
$('backdrop').addEventListener('click', closeDrawer);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });

async function refreshDrawer() {
  const j = job(open.id); if (!j) return closeDrawer();
  $('d-id').textContent = j.id;
  $('d-stage').textContent = `${j.stage}${j.round ? ' · ronda ' + j.round : ''} · creado ${ago(j.created)}`;
  $('d-feat').textContent = j.feature || '';
  $('d-approve').hidden = j.stage !== 'needs-human';
  const tabs = j.files.map((f) => ({ key: f, label: f.replace('round-', 'R').replace('/review-', ' · ') }));
  tabs.push({ key: 'diff', label: 'Cambios (diff)', sep: true }, { key: 'log', label: 'Commits' });
  $('tabs').innerHTML = tabs.map((t) => `<button class="tab ${t.key === open.tab ? 'on' : ''} ${t.sep ? 'sep' : ''}" data-tab="${esc(t.key)}">${esc(t.label)}</button>`).join('');
  for (const b of document.querySelectorAll('.tab')) b.addEventListener('click', () => { open.tab = b.dataset.tab; refreshDrawer(); });
  const c = $('content');
  try {
    if (open.tab === 'diff' || open.tab === 'log') {
      const r = await getJson(`/api/${open.tab}?job=${encodeURIComponent(j.id)}`);
      c.innerHTML = `<div class="source">${esc(r.source || '')}</div>` + (r.ok ? `<pre class="diff">${open.tab === 'diff' ? diffHtml(r.text) : esc(r.text)}</pre>` : `<div class="empty">${esc(r.text)}</div>`);
    } else {
      const text = await getText(`/api/file?job=${encodeURIComponent(j.id)}&path=${encodeURIComponent(open.tab)}`);
      c.innerHTML = open.tab.endsWith('.json') ? `<pre class="diff">${esc(text)}</pre>` : mdHtml(text);
    }
  } catch (e) { c.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

function diffHtml(text) {
  return text.split('\n').map((l) => {
    if (l.startsWith('diff --git')) return `<span class="file">${esc(l)}</span>`;
    if (l.startsWith('+++') || l.startsWith('---') || l.startsWith('index ')) return `<span class="stat">${esc(l)}</span>`;
    if (l.startsWith('@@')) return `<span class="hunk">${esc(l)}</span>`;
    if (l.startsWith('+')) return `<span class="add">${esc(l)}</span>`;
    if (l.startsWith('-')) return `<span class="del">${esc(l)}</span>`;
    if (/^ .*\|/.test(l) || /files? changed/.test(l)) return `<span class="stat">${esc(l)}</span>`;
    return esc(l);
  }).join('\n');
}

// Markdown mínimo: títulos, listas, checkboxes, código, tablas, citas, negrita, enlaces.
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function mdHtml(text) {
  const lines = text.split(/\r?\n/);
  let html = '', list = null, para = [], code = null, table = null;
  const flushPara = () => { if (para.length) { html += `<p>${para.map(inline).join('<br>')}</p>`; para = []; } };
  const flushList = () => { if (list) { html += `</${list}>`; list = null; } };
  const flushTable = () => { if (table) { html += '<table>' + table.map((r, i) => `<tr>${r.map((c) => `<${i ? 'td' : 'th'}>${inline(c)}</${i ? 'td' : 'th'}>`).join('')}</tr>`).join('') + '</table>'; table = null; } };
  const first = lines[0] && lines[0].trim();
  const verdict = first && first.match(/^(?:VERDICT:\s*|STATUS:\s*)?(PASS|CHANGES|APPROVE|ESCALATE|READY|BLOCKED)$/);
  for (let i = verdict ? 1 : 0; i < lines.length; i++) {
    const l = lines[i];
    if (code !== null) { if (l.startsWith('```')) { html += `<pre><code>${esc(code.join('\n'))}</code></pre>`; code = null; } else code.push(l); continue; }
    if (l.startsWith('```')) { flushPara(); flushList(); flushTable(); code = []; continue; }
    if (/^\|/.test(l)) { flushPara(); flushList(); if (/^\|\s*-+/.test(l)) continue; (table ||= []).push(l.replace(/^\||\|$/g, '').split('|').map((c) => c.trim())); continue; }
    flushTable();
    let m;
    if ((m = l.match(/^(#{1,6})\s+(.*)/))) { flushPara(); flushList(); html += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; }
    else if ((m = l.match(/^>\s?(.*)/))) { flushPara(); flushList(); html += `<blockquote>${inline(m[1])}</blockquote>`; }
    else if ((m = l.match(/^\s*(?:[-*]|\d+\.)\s+(.*)/))) {
      flushPara(); const type = /^\s*\d/.test(l) ? 'ol' : 'ul';
      if (list !== type) { flushList(); html += `<${type}>`; list = type; }
      const item = m[1].replace(/^\[( |x)\]\s*/i, (_, x) => `<input type="checkbox" disabled ${x.toLowerCase() === 'x' ? 'checked' : ''}>`);
      html += `<li>${item.startsWith('<input') ? item.slice(0, item.indexOf('>') + 1) + inline(item.slice(item.indexOf('>') + 1)) : inline(item)}</li>`;
    }
    else if (!l.trim()) { flushPara(); flushList(); }
    else para.push(l.trim());
  }
  flushPara(); flushList(); flushTable();
  return (verdict ? `<span class="verdict ${esc(verdict[1])}">${esc(first)}</span>` : '') + `<div class="md">${html}</div>`;
}

poll();
setInterval(poll, POLL_MS);
</script>
</body>
