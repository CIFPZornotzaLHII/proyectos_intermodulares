# Web de proyectos: sirve la aplicación React (compilada en /usr/share/nginx/html), las landings del alumnado
# (carpeta proyectos/ del repo, montada en /proyectos) y pasa /api/ a la API Node.
# El proxy (proxy/nginx.conf) quita el prefijo /proyectos antes de llegar aquí; la web está compilada con
# base /proyectos/ (vite.config.js), así que sus ficheros se piden como /proyectos/assets/… y llegan como /assets/….
# DNS interno de Docker: la API va en una variable para que nginx la busque en cada petición y la siga
# encontrando aunque se recree y cambie de IP.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Rutas de la aplicación (/, /galeria, /entrar): si no es un fichero, devuelve index.html y decide el router
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
    # Ficheros compilados con hash en el nombre: cacheables para siempre
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

    # Nombres de la versión anterior de la web (enlaces antiguos)
    location = /proyectos.html { return 301 $http_x_forwarded_prefix/galeria; }
    location = /login.html { return 301 $http_x_forwarded_prefix/entrar; }

    # Landings de los proyectos: proyectos/<ciclo>/<slug>/index.html → /p/<ciclo>/<slug>/
    location /p/ {
        alias /proyectos/;
        index index.html;
        autoindex off;
        add_header Cache-Control "no-cache";
        # nunca se sirven los ficheros de datos del proyecto ni carpetas ocultas
        location ~ /p/.*/(proyecto\.json|\.[^/]+)$ { return 404; }
    }

    location /api/ {
        set $api proyectos-api:3000;
        proxy_pass http://$api;                  # sin ruta detrás: la petición pasa tal cual (/api/…)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /salud { return 200 "ok\n"; add_header Content-Type text/plain; }
}
