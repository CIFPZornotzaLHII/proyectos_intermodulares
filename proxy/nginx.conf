# Proxy · reverse proxy en el puerto 80. Cada aplicación cuelga de una ruta.

# DNS interno de Docker. Cada location pone su servicio en una variable ($destino) para que nginx lo
# busque en cada petición (guardando la respuesta 10 s) y no una sola vez al arrancar. Así, cuando un
# despliegue recrea un contenedor y cambia de IP, el proxy lo sigue encontrando, y arranca aunque alguna
# aplicación esté parada.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;

    # Con una sola aplicación, la raíz va directa a los proyectos. Si algún día hay más, cambia esto por
    # una página de inicio (como en server_isard_som) o deja la redirección.
    location = / { return 302 /proyectos/; }
    location = /salud { return 200 "ok\n"; add_header Content-Type text/plain; }

    # --- Web de proyectos intermodulares (apps/proyectos: "proyectos-web", que habla con "proyectos-api") ---
    location = /proyectos { return 301 /proyectos/; }
    location /proyectos/ {
        set $destino proyectos-web:80;
        rewrite ^/proyectos(/.*)$ $1 break;   # quita el prefijo /proyectos antes de pasarlo
        proxy_pass http://$destino;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Prefix /proyectos;
        client_max_body_size 2m;
    }

    # --- Para añadir otra aplicación: copia el bloque de arriba cambiando ruta y servicio e incluye su
    #     compose en el docker-compose.yml de la raíz ---
}
